name: Update live stock ideas

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6-20/2 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build live ideas snapshot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/update_live_ideas.py
      - name: Commit refreshed data
        run: |
          git config user.name "Morten Market Bot"
          git config user.email "actions@users.noreply.github.com"
          git add live-ideas.json
          git diff --cached --quiet || git commit -m "Update live market ideas"
          git push
